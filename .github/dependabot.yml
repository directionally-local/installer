# Keep dl on the latest Autopilot and Hotcell without manual pin bumps. Merged
# automatically once CI passes (see .github/workflows/deps-automerge.yml); the
# `fix(deps)` commit then makes release-please cut a release.
#
# dl pins autopilot-ai and hotcell exactly (no range) on purpose: the session
# client dl ships and the server it talks to must not drift, and two people
# installing the same dl must get the same sandboxes. That also means nothing
# bumps them unless this file exists — which is why the Autopilot pin sat on
# 3.0.2 while 3.0.3 had the `connect --state-file` flag the setup needs.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    allow:
      - dependency-name: autopilot-ai
      - dependency-name: hotcell
    # Raise the pin itself, not just the lockfile.
    versioning-strategy: increase
    # Dependabot waits 3 days before it considers a new version, even with no
    # cooldown configured. These are our own packages, released several times a
    # day, so every new version stayed "too new" and no pin bump was ever
    # opened. Take them as soon as they're published.
    cooldown:
      exclude:
        - autopilot-ai
        - hotcell
    groups:
      own-packages:
        patterns: ["autopilot-ai", "hotcell"]
    commit-message:
      prefix: fix(deps)
    labels: [dependencies]
    open-pull-requests-limit: 2
