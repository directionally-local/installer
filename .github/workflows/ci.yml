name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The published tarball must carry npm-shrinkwrap.json (prepack writes it from
      # package-lock.json, production dependencies only) so `npm install -g` pins dl's
      # transitive dependencies instead of resolving them from ranges.
      - run: node scripts/check-shrinkwrap.mjs
      - run: shellcheck install.sh
  # Wall-clock speed checks on large generated data (services/**/*.perf.ts). They depend
  # on the runner's speed, so they're reported here but never block a merge or a
  # release; they aren't part of `npm test` or prepublish. See issue #222.
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run test:perf
  # The site worker must stay deployable to Serverless Objects as well as
  # Cloudflare. Pinned because the CLI is pre-alpha; bump it deliberately.
  portability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npx --yes serverless-objects@0.13.4 build --strict site
  # The services must deploy to a self-hosted Serverless Objects node with no
  # code changes. `--strict` catches Node.js built-ins; the lint catches the
  # Cloudflare-only APIs it doesn't look at.
  services:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        service: [name, free]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - run: npm ci
      - run: node scripts/check-portable-apis.mjs services/${{ matrix.service }} services/shared
      - run: npx --yes serverless-objects@0.13.4 build --strict services/${{ matrix.service }}
