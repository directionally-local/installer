name: release

on:
  push:
    branches: [main]
  # Re-run the publish job by hand (e.g. if a release's publish failed).
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release

  # Publishes when release-please has just cut a release (its release PR was merged),
  # or on a manual run. Auth is npm trusted publishing (OIDC) from the `npm`
  # environment: no npm token is stored anywhere. npm checks this repository,
  # this workflow file, and the environment, as configured on npmjs.com under the
  # package's Settings -> Trusted Publisher. Provenance is attached automatically.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          check-latest: true
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Publish to npm and wait until it's installable
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view --prefer-online "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm."
          else
            npm publish --access public
          fi
          for attempt in $(seq 1 30); do
            if npm view --prefer-online "$NAME@$VERSION" version >/dev/null 2>&1; then
              echo "$NAME@$VERSION is available on npm."
              exit 0
            fi
            echo "Waiting for $NAME@$VERSION to appear on npm ($attempt/30)."
            sleep 10
          done
          echo "::error::$NAME@$VERSION wasn't installable after publishing."
          exit 1

  # The install script at https://directionallylocal.run is part of the release: it's
  # deployed only after that version is on npm, so the one-liner and
  # `npm install directionallylocal@latest` always match. Needs two repository (or
  # organization) secrets: CLOUDFLARE_API_TOKEN (the "Edit Cloudflare Workers" token
  # template, limited to the directionallylocal.run zone) and CLOUDFLARE_ACCOUNT_ID.
  deploy-site:
    needs: [release-please, publish]
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: cloudflare
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          check-latest: true

      - run: npm ci
      - run: npx tsx --test "site/**/*.test.ts"

      - name: Deploy the Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c site/wrangler.toml

      - name: Check the live script is this release's install.sh
        run: |
          for attempt in $(seq 1 12); do
            if curl -fsSL https://directionallylocal.run | cmp -s - install.sh; then
              echo "https://directionallylocal.run serves this release's install.sh."
              exit 0
            fi
            echo "Not updated yet ($attempt/12)."
            sleep 10
          done
          echo "::error::https://directionallylocal.run doesn't serve this release's install.sh."
          exit 1
